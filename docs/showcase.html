<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Radiofy — showcase</title>
<link rel="stylesheet" href="../radio/ui/app.css">
<link rel="stylesheet" href="../radio/ui/skins.css">
<style>
  html,body{margin:0;background:#0a0a0c}
  .stage{padding:28px;display:flex;flex-direction:column;gap:28px;align-items:center}
  .shot{
    width:360px;min-height:520px;border-radius:24px;overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,.55);
    position:relative;
  }
  .shot .app{min-height:520px;box-sizing:border-box}
  .shot .setup,.shot .menu,.shot .about,.shot .mini{display:none!important}
  .shot .now-card,.shot .dial,.shot .hzr,.shot .btns,.shot .dv,.shot .ft{display:flex}
  .shot .now-card{display:block}
  .cap{color:rgba(255,255,255,.55);font:12px/1.3 -apple-system,BlinkMacSystemFont,sans-serif;text-align:center;margin-top:10px;letter-spacing:.04em;text-transform:uppercase}
  .ph{opacity:.35}
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
const skins=[
  {id:'onair',label:'On Air'},
  {id:'neon',label:'Neon'},
  {id:'classic',label:'Classic'},
  {id:'vinyl',label:'Vinyl'},
  {id:'studio',label:'Studio'}
];
const art='../radio/ui/onair-hero.jpg'; // placeholder cover look; real cover is square crop in app
function panel(skin){
  return `<div class="shot" id="shot-${skin.id}" data-skin="${skin.id}">
<body data-skin="${skin.id}" style="margin:0;background:transparent">
<div class="app">
 <div class="studio-hero" aria-hidden="true">
  <div class="bounce bounce-velvet"></div>
  <div class="bounce bounce-metal"></div>
  <div class="bounce bounce-spec"></div>
 </div>
 <header class="hd">
  <button class="logo" type="button"><h1>Radiofy</h1></button>
  <button class="ov" type="button">▁</button>
 </header>
 <div class="now-card">
  <div class="artw">
   <div class="vinyl-stage">
    <div class="art">
     <div class="label"><img class="ai on" src="${art}" alt="" style="opacity:1;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit"></div>
    </div>
    <div class="arm" aria-hidden="true"></div>
   </div>
  </div>
  <div class="meta"><div class="ti">Midnight City</div><div class="ar">M83</div></div>
 </div>
 <div class="dial"><svg class="sc" viewBox="0 0 312 44" width="100%" height="100%">
  <line class="mj" x1="40" x2="40" y1="8" y2="22" stroke="currentColor"/><text x="40" y="38" text-anchor="middle" font-size="11">88</text>
  <line class="mj" x1="118" x2="118" y1="8" y2="22"/><text x="118" y="38" text-anchor="middle" font-size="11">96</text>
  <line class="mj" x1="196" x2="196" y1="8" y2="22"/><text x="196" y="38" text-anchor="middle" font-size="11">104</text>
  <line class="mj" x1="274" x2="274" y1="8" y2="22"/><text x="274" y="38" text-anchor="middle" font-size="11">108</text>
 </svg><div class="nd" style="transform:translate3d(156px,0,0)"><i></i></div></div>
 <div class="hzr"><span>98.0</span> MHz</div>
 <div class="btns">
  <button class="cam" type="button"><span class="ring"><i></i></span><svg viewBox="0 0 24 24"><path d="M3 7h3.5c2.2 0 3.4 1 4.6 2.8l1.8 2.4c1.2 1.8 2.4 2.8 4.6 2.8H21"/></svg><b>Cambiar</b></button>
  <button class="pill" type="button">Desde el inicio</button>
 </div>
 <button class="dv" type="button"><span class="dl">Sonando en</span><span class="dn">Spotify en este Mac</span></button>
 <footer class="ft">
  <button class="chip" type="button"><span>Liked Songs</span></button>
  <label class="tg"><span>Modo radio</span><button class="sw on" type="button"><i></i></button></label>
 </footer>
</div>
</body>
<div class="cap">${skin.label}</div>
</div>`;
}
// Fix: data-skin must be on an ancestor that CSS selectors match — put on .shot and also set attribute for [data-skin=]
const stage=document.getElementById('stage');
skins.forEach(s=>{
  const wrap=document.createElement('div');
  wrap.style.cssText='display:flex;flex-direction:column;align-items:center';
  const shot=document.createElement('div');
  shot.className='shot';
  shot.id='shot-'+s.id;
  shot.setAttribute('data-skin', s.id);
  shot.innerHTML=`
<div class="app">
 <div class="studio-hero" aria-hidden="true">
  <div class="bounce bounce-velvet"></div>
  <div class="bounce bounce-metal"></div>
  <div class="bounce bounce-spec"></div>
 </div>
 <header class="hd">
  <button class="logo" type="button"><h1>Radiofy</h1></button>
  <button class="ov" type="button">▁</button>
 </header>
 <div class="now-card">
  <div class="artw">
   <div class="vinyl-stage">
    <div class="art">
     <div class="label"><img class="ai on" src="${art}" alt="" style="opacity:1;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit"></div>
    </div>
    <div class="arm" aria-hidden="true"></div>
   </div>
  </div>
  <div class="meta"><div class="ti">Midnight City</div><div class="ar">M83</div></div>
 </div>
 <div class="dial"><svg class="sc" viewBox="0 0 312 44" width="100%" height="44">
  <line class="mj" x1="40" y1="8" x2="40" y2="22"></line><text x="40" y="38">88</text>
  <line class="mj" x1="118" y1="8" x2="118" y2="22"></line><text x="118" y="38">96</text>
  <line class="mj" x1="196" y1="8" x2="196" y2="22"></line><text x="196" y="38">104</text>
  <line class="mj" x1="274" y1="8" x2="274" y2="22"></line><text x="274" y="38">108</text>
 </svg><div class="nd" style="transform:translate3d(156px,0,0)"><i></i></div></div>
 <div class="hzr"><span>98.0</span> MHz</div>
 <div class="btns">
  <button class="cam" type="button"><span class="ring"><i></i></span><svg viewBox="0 0 24 24"><path d="M3 7h3.5c2.2 0 3.4 1 4.6 2.8l1.8 2.4c1.2 1.8 2.4 2.8 4.6 2.8H21"/></svg><b>Cambiar</b></button>
  <button class="pill" type="button">Desde el inicio</button>
 </div>
 <button class="dv" type="button"><span class="dl">Sonando en</span><span class="dn">Spotify en este Mac</span></button>
 <footer class="ft">
  <button class="chip" type="button"><span>Liked Songs</span></button>
  <label class="tg"><span>Modo radio</span><button class="sw on" type="button"><i></i></button></label>
 </footer>
</div>`;
  // CSS expects body[data-skin] or [data-skin] — set on shot; also mirror to a fake body class via attribute on .app parent
  // skins.css uses [data-skin="x"] .app — so data-skin on .shot works if selector is [data-skin] .app
  const cap=document.createElement('div');
  cap.className='cap';
  cap.textContent=s.label;
  wrap.appendChild(shot);
  wrap.appendChild(cap);
  stage.appendChild(wrap);
});
</script>
</body>
</html>
